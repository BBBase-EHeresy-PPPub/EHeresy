site_name: Epic Heresy
docs_dir: docs/at2018

theme:
  name: material
  palette:
    scheme: adeptus-titanicus
  custom_dir: overrides
  logo: assets/AT_logo.png
  favicon: assets/EH_Favicon.ico
  features:
    - header.autohide
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - versioning

plugins:
  - search

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/search-result-navigation.js

markdown_extensions:
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.tilde
  - attr_list
  - pymdownx.snippets:
      base_path: includes/at2018
      auto_append:
        - tooltip_weapon_traits.md

validation:
  absolute_links: ignore

nav:
  - Rulebook:
      - Rulebook: rulebook/index.md
      - The Rules: rulebook/the_rules.md
      - Basic Rules: rulebook/basic_rules.md
      - Advanced Rules: rulebook/advanced_rules.md
